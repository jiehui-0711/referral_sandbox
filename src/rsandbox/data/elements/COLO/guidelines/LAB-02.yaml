# 指引 LAB-02：preop_blood_test
# Agent 用 search_guidelines 檢索得到這一份。回傳的欄位只有五個：
#     guideline_id / decision / title / when / action
#   - 條件式，不是散文，不可能被讀錯，只可能被挑錯哪一份適用
#   - 不回傳 以下的欄位絕對不會給 Agent
#   - when.procedure_category 就是這份指引適用哪一種處置，不另開一個
#     屬性，適用範圍本來就是條件的一部分
guideline_id: LAB-02
decision: preop_blood_test
title: Pre-procedure blood test when no anticoagulant has been withheld
when:
  procedure_category: endoscopic
  hold_days: 0
action:
  test: none

#  不回傳給 Agent
source: self_authored
source_type: self_authored
reviewed_by: null
assumption: 本案例不會命中。自訂設定：沒有停藥就不需要術前抽血。
