# 指引 HOLD-03：withhold:warfarin
# Agent 用 search_guidelines 檢索得到這一份。回傳的欄位只有五個：
#     guideline_id / decision / title / when / action
#   - 條件式，不是散文，不可能被讀錯，只可能被挑錯哪一份適用
#   - 不回傳 以下的欄位絕對不會給 Agent
#   - when.procedure_category 就是這份指引適用哪一種處置，不另開一個
#     屬性，適用範圍本來就是條件的一部分
guideline_id: HOLD-03
decision: withhold:warfarin
title: Withholding warfarin before a low bleeding-risk endoscopic procedure
when:
  procedure_category: endoscopic
  drug: warfarin
  indication_class: any
  procedure_risk: low
action:
  hold_days: 0
  substitute: none

#  不回傳給 Agent
source: self_authored
source_type: self_authored
reviewed_by: null
assumption: '本案例不會命中。自訂設定：低出血風險的處置不需停藥， 不論吃藥的原因是什麼（indication_class: any）。'
