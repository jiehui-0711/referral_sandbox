# 指引 RISK-01：bleeding_risk
# Agent 用 search_guidelines 檢索得到這一份。回傳的欄位只有五個：
#     guideline_id / decision / title / when / action
#   - 條件式，不是散文，不可能被讀錯，只可能被挑錯哪一份適用
#   - 不回傳 以下的欄位絕對不會給 Agent
#   - when.procedure_category 就是這份指引適用哪一種處置，不另開一個
#     屬性，適用範圍本來就是條件的一部分
guideline_id: RISK-01
decision: bleeding_risk
title: Bleeding risk of a full colonoscopy
when:
  procedure_category: endoscopic
  procedure: colonoscopy_full
action:
  procedure_risk: high

#  不回傳給 Agent
source: self_authored
source_type: self_authored
reviewed_by: null
assumption: 本案例命中這一條。自訂設定：全大腸鏡視為高出血風險， 理由是預期可能當場執行息肉切除而造成傷口。
