# 元素 UGI：上消化道內視鏡
# 一個元素 = 一個臨床能力包，跨醫院。它宣告自己需要哪些科別與項目，
# 以及那些科別／項目的規定與診次。
#   - 科別可以被多個元素宣告（骨科同時被人工膝關節與骨折用到），
#     載入器會合併，屬性不一致才報錯
#   - 任務清單用 elements 選它當必要元素，用 distractors 選它當干擾
#     元素。內容完全一樣，干擾不另外撰寫
element_id: UGI
title: 上消化道內視鏡

#  這個元素需要的科別與項目
departments:
  # 掛在 H1
  - dept_id: H1_GI
    dept: GI
    name: Gastroenterology               #消化內科
    status: published
    block_ids: [H1.GI.1]
    # 大腸鏡任務的正確科別。白話：大腸鏡是消化內科在做的，
    # 雖然科名裡沒有大腸兩個字。
    services:
      - {code: GAS,  name: Gastroscopy,                    slot_type: endoscopy,
         block_ids: [H1.GI.GAS.1]}
  # 胃鏡。干擾項
  # 掛在 H2
  - dept_id: H2_GI
    dept: GI
    name: Gastroenterology               #消化內科
    status: published
    block_ids: [H2.GI.1]
    services:
      - {code: CAP,  name: Capsule endoscopy,              slot_type: endoscopy,
         block_ids: [H2.GI.CAP.1]}
        # 小腸膠囊內視鏡。干擾項

  # 掛在 H3
  - dept_id: H3_GI
    dept: GI
    name: Gastroenterology               #消化內科
    status: published
    block_ids: [H3.GI.1]
    services:
      - {code: GAS,  name: Gastroscopy,                    slot_type: endoscopy,
         block_ids: [H3.GI.GAS.1]}

#  科別層與項目層的資訊段落
blocks:

- {id: H1.GI.GAS.1, scope: service, owner: H1/GI/GAS, role: distractor, reveal: always,
   text: "Monday to Friday mornings. Nothing to eat after midnight."}
  # 平日上午。前晚午夜後禁食
- {id: H2.GI.CAP.1, scope: service, owner: H2/GI/CAP, role: distractor, reveal: always,
   text: "Capsule endoscopy for small-bowel examination, by specialist referral only."}
  # 小腸膠囊內視鏡，限專科轉介

- {id: H3.GI.GAS.1, scope: service, owner: H3/GI/GAS, role: distractor, reveal: always,
   text: "Monday to Friday mornings."}


#  診次規則
slot_rules:

- rule_id: R-H1-GI-GAS
  institution_id: H1
  dept: GI
  service: GAS
  weekdays: [Mon, Tue, Wed, Thu, Fri]
  period: AM
  capacity: 2
  date_from: "2026-09-01"
  date_to: "2026-10-31"

- rule_id: R-H3-GI-GAS
  institution_id: H3
  dept: GI
  service: GAS
  weekdays: [Mon, Tue, Wed, Thu, Fri]
  period: AM
  capacity: 2
  date_from: "2026-09-01"
  date_to: "2026-10-31"

- rule_id: R-H2-GI-CAP
  institution_id: H2
  dept: GI
  service: CAP
  weekdays: [Wed]
  period: AM
  capacity: 1
  date_from: "2026-09-01"
  date_to: "2026-10-31"

