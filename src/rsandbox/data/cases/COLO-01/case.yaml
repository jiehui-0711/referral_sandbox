# COLO-01：大腸鏡轉診。一個資料夾 = 一組完整的任務。
# 這個檔放整組共用的東西，各個變體只寫跟這裡差在哪。
#   case.yaml          ← 這個檔：病人、起點、時鐘
#   record.yaml        這一組的病歷
#   patient_doc.yaml   這一組病人的個人視角資料
#   v0_clean.yaml      無擾動。其他變體都接在它跑完的狀態上
#   v1_postponed.yaml  病人要求延後
#   v2_contact_only.yaml   只換電話（負控制）
#   v3_earlier.yaml    病人要求提前
#   v4_slot_cancelled.yaml 醫院取消時段
#   v5_self_stopped.yaml   病人自行提前停藥
#   scripts/           腳本。額外的檢查素材，不是任務定義的一部分
#
#   - 要新增一組任務，複製這整個資料夾改內容就好，載入器掃 cases/
#     底下所有資料夾
#   - 世界是組裝出來的：固定層（五個機構）＋ 下面宣告的元素。元素的
#     內容全部在全域的 elements/ 裡，這裡只決定這一題用哪幾個
case_id: COLO-01
title: 大腸鏡轉診
patient_id: P001

# Agent 一開始站在哪個節點。
start_node: C0

# 整組共用的時鐘設定。變體可以自己覆寫起始日與結束日
# （擾動發生在不同天，所以起始日幾乎都要覆寫）。
clock:
  advance_on: end_turn
  days_per_turn: 1
  end_date: "2026-09-30"

# 元素清單：這一題的世界由哪些元素組成。
#
#   - 必要（elements）與干擾（distractors）的內容完全一樣，干擾不另外
#     撰寫。某一題的必要元素，就是別題的干擾元素
#   - 干擾要明列，不是世界裡的其他全部，這樣干擾的數量才固定：元素庫
#     有 30 組時，一題挑 10 組當干擾
#   - 代價是加第 31 組元素不會自動變成這一題的干擾。難度由清單決定，
#     不由語料大小決定
elements:
  - COLO                     # 消化內科 ＋ 大腸鏡／無痛大腸鏡／初診

distractors:
  - CRS                      # 最強的誘餌：大腸直腸外科。科名裡有大腸，
                             #   語意上比消化內科更像答案，但它沒有內視鏡診次
  - ANTICOAG                 # 誘餌：抗凝血照護門診。正在處理 warfarin 的
                             #   Agent 會覺得超級相關
  - UGI                      # 胃鏡、膠囊內視鏡。同一科的其他項目
  - IMAGING                  # 腹部超音波、血液科
  - TKA                      # 人工膝關節置換（另一組任務的必要元素）
  - FRACTURE                 # 骨折、運動傷害
  - REHAB                    # 復健
  - ENDO                     # 內分泌
  - DENT                     # 牙科
  - ANES                     # 麻醉評估
  - LAB                      # 檢驗科
  - PRIMARY                  # 一般內科、家醫科
