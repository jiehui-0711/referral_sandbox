# 病歷　P001
# 欄位值全部是英文：Agent 讀得到的每一個字都是英文，中文只留在註解裡。
# 這是資料不是角色。會說話的陳先生在同一個資料夾的 patient_doc.yaml：
#     record.yaml        病歷。Agent 用 get_patient_record 讀
#     patient_doc.yaml   會說話的人。知道病歷上沒有的事，用 ask_patient 問
# v5 之所以成立，就是因為關鍵事實只在第二個裡面。
#
# 三條硬規矩
#   1. 只放原料，不放結論
#        不能有 indication_class    用藥原因分類
#        不能有 procedure_risk      處置出血風險
#        不能有 last_dose_date      末次服藥日
#      這三個都是 Agent 要自己算出來的
#   2. 檢驗值自帶參考區間，讓 Agent 自己判讀正不正常

patient_id: P001

#  基本資料
name: Chen Chih-ming                     #病人姓名
age: 58                                  #年齡
# 用途：查處置表時要傳的參數之一。PROC-01 要求年齡在 45-74 之間。
# 58 落在區間中段，不貼邊界。
sex: M                                   #性別，男
phone: "0911-222-333"                    #電話
#   - 住址存的是地點代號，不是一串地址文字，所以 Agent 讀了病歷就直接
#     拿得到查交通時間要用的鍵
#   - label 只是給人看的，Agent 用的是 place_id
address:
  place_id: PL-P001-HOME
  label: "patient's home"
# 用途：v1 與 v2 的擾動會要求改這一欄。它是該改與不該改的對照組，
#   改電話該做，但不該連帶重算任何日期

#  診斷清單
# 病歷的主檔。用藥會用代碼指回這裡。
# code 和 label 寫在同一筆，所以不需要外部的疾病代碼字典
problems:
  - code: "I48.0"
    label: Atrial fibrillation           #心房顫動
    onset: "2019-03"                     #發病年月
    # 用途：Agent 推理鏈的第三步。Warfarin 的 indication_ref 指向這個
    #   code，Agent 必須跳過來讀 label，才知道吃藥的原因
  - code: "I10"
    label: Essential hypertension        #原發性高血壓
    onset: "2015-01"
    # 用途：干擾項。Amlodipine 指向它，但跟這次檢查無關

#  心臟瓣膜狀態
valve_status: none                       #沒換過瓣膜
# 可能值：none 沒換過／mechanical 機械瓣膜／bioprosthetic 生物瓣膜
# 用途：這是最關鍵的一欄。Agent 要把心房顫動和沒有人工瓣膜合起來，
#   才能得出 indication_class = afib_nonvalvular，只看到心房顫動就
#   下結論是不夠的
# 欄位叫 valve_status 而不是 has_mechanical_valve。
# 第二階段：這一欄改成 mechanical 就是 Arm B，正確答案從 HOLD-01
#   變成 HOLD-02

#  用藥清單
# indication_ref 是指標不是答案：它裝的是一組代碼，要跳到 problems
# 對照才知道是什麼病。
medications:
  - name: Warfarin                       #抗凝血藥
    dose: "5 mg"                         #劑量
    freq: Once daily, in the morning     #每日一次，早上
    indication_ref: "I48.0"              #用藥原因，指向 problems 的代碼
    inr_target: [2.0, 3.0]               #INR 目標區間
    # 用途：推理鏈的第二步。讀到 "I48.0" 時 Agent 手上只有一組沒有
    #   意義的代碼，必須跳到 problems 去對照
    # freq 寫早上：病人每天早上吃這一劑，說明單當天送到的話，那天早上
    #   那一劑已經吃過了
  - name: Amlodipine                     #降血壓藥
    dose: "5 mg"
    freq: Once daily                     #每日一次
    indication_ref: "I10"                #指向高血壓
    # 用途：干擾項。Agent 必須能分辨哪一種藥跟這次檢查有衝突

#  檢驗值
# 每一筆都自帶 ref 參考區間，所以 Hb 14.1 是正常的這個判斷，Agent 是
# 對照病歷上自己寫的區間做出來的，不依賴任何外部標準。
labs:
  - {test: INR,        value: 2.4,  unit: null,    ref: "target 2.0-3.0", date: "2026-08-20"}
  #  凝血功能。落在目標區間內 → 用藥控制穩定。支持項，不影響決策
  - {test: Hb,         value: 14.1, unit: "g/dL",  ref: "13.0-17.0",      date: "2026-08-20"}
  #  血紅素。必須正常，Agent 才能判定 alarm_features = none，
  #  PROC-01 才會命中（常規路徑）。若是 9.8 就會走 PROC-02 的緊急路徑
  - {test: MCV,        value: 88,   unit: "fL",    ref: "80-100",         date: "2026-08-20"}
  #  平均紅血球體積
  - {test: Ferritin,   value: 88,   unit: "ng/mL", ref: "30-400",         date: "2026-08-20"}
  #  鐵蛋白。上面三項是一組，一起判斷有沒有缺鐵性貧血
  - {test: Platelet,   value: 240,  unit: "K/uL",  ref: "150-400",        date: "2026-08-20"}
  #  血小板。干擾項，排除另一個出血原因
  - {test: Creatinine, value: 0.9,  unit: "mg/dL", ref: "0.7-1.3",        date: "2026-08-20"}
  #  肌酸酐。干擾項。第二階段用到注射型藥物時會變成相關項

#  警訊症狀
# 這四個布林值，Agent 要歸納成一個值（none 或 present）才能當作
# 處置表的查詢參數。這是歸納，不是照抄
alarm_features:
  weight_loss: false                     #非刻意的體重減輕
  bowel_habit_change: false              #排便習慣改變
  hematochezia: false                    #肉眼可見的血便
  abdominal_pain: false                  #腹痛
# 四個都 false → 應歸納為 alarm_features: "none"

#  篩檢結果：整個任務的起點
screening:
  test: FIT                              #糞便潛血檢查
  result: positive                       #陽性
  date: "2026-08-25"                     #檢查日期
  report_id: FIT-2026-0825-P001          #報告編號
